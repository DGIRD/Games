<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La Course du Calcul</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#bfe8ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Course Calcul">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#bfe8ff; --grass:#7ccf6b; --grass2:#5fb84f; --road:#4b4f58; --ink:#23324a;
    --yellow:#ffd23f; --red:#ff5a5f; --green:#2fbf71; --blue:#3a86ff; --card:#ffffff;
    --carw:clamp(70px,12vw,120px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:linear-gradient(var(--sky) 0 55%,var(--grass) 55%);
       touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow-x:hidden}
  .screen{display:none;min-height:100%;padding:16px;flex-direction:column;align-items:center}
  .screen.on{display:flex}
  h1{font-size:clamp(34px,6vw,60px);margin:8px 0 4px;text-align:center;line-height:1;color:#fff;
     text-shadow:0 4px 0 #1d6fd1,0 8px 18px rgba(0,0,0,.2)}
  .sub{margin:0 0 14px;font-size:clamp(16px,2.4vw,22px);text-align:center}
  .card{background:var(--card);border-radius:24px;padding:18px 20px;width:min(760px,100%);box-shadow:0 8px 0 rgba(0,0,0,.08),0 12px 30px rgba(0,0,0,.12);margin-bottom:14px}
  .card h2{margin:0 0 10px;font-size:clamp(20px,3vw,26px)}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{border:3px solid #dfe7f2;background:#f6f9fd;border-radius:18px;padding:12px 10px;font:inherit;font-size:clamp(17px,2.4vw,21px);font-weight:700;color:var(--ink);cursor:pointer;text-align:center;line-height:1.15}
  .opt small{display:block;font-weight:500;font-size:.75em;opacity:.7}
  .opt .big{font-size:1.8em;display:block;line-height:1.1}
  .opt.sel{border-color:var(--blue);background:#e6f0ff;box-shadow:0 4px 0 var(--blue)}
  .chips[hidden]{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{min-width:56px;padding:8px 12px;border-radius:999px;border:3px solid #dfe7f2;background:#f6f9fd;font:inherit;font-weight:800;font-size:20px;color:var(--ink);cursor:pointer}
  .chip.sel{background:var(--yellow);border-color:#e6b800}
  .colors{display:flex;gap:12px;flex-wrap:wrap}
  .color{width:64px;height:64px;border-radius:18px;border:4px solid transparent;cursor:pointer;display:grid;place-items:center;background:#f6f9fd}
  .color.sel{border-color:var(--ink)}
  .color svg{width:52px}
  .go{font:inherit;font-weight:800;font-size:clamp(26px,4vw,36px);background:var(--red);color:#fff;border:none;border-radius:22px;padding:12px 44px;
      box-shadow:0 7px 0 #c63d42;cursor:pointer;margin:6px 0 20px}
  .go:active{transform:translateY(5px);box-shadow:0 2px 0 #c63d42}
  .best{font-size:16px;opacity:.75;text-align:center;margin-top:-10px;margin-bottom:12px}

  /* RACE */
  #menu{padding-top:62px}
  #race{padding:10px 12px;gap:10px;justify-content:flex-start}
  .topbar{display:flex;justify-content:space-between;align-items:center;width:min(1000px,100%);gap:8px}
  .pill{background:#fff;border-radius:999px;padding:4px 16px;font-weight:800;font-size:clamp(18px,2.6vw,24px);box-shadow:0 4px 0 rgba(0,0,0,.08)}
  .quit{font:inherit;font-weight:700;border:none;background:#fff;border-radius:999px;padding:6px 14px;font-size:18px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.08)}
  .track{position:relative;width:min(1000px,100%);background:var(--road);border-radius:18px;padding:10px 0;border:6px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.12)}
  .lane{position:relative;height:clamp(64px,11vw,96px);margin:0 46px 0 10px}
  .lane+.lane{border-top:4px dashed rgba(255,255,255,.55)}
  .finish{position:absolute;top:0;bottom:0;right:10px;width:30px;border-radius:0 12px 12px 0;
          background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/15px 15px}
  .car{position:absolute;top:50%;width:var(--carw);transform:translateY(-50%);left:0;transition:left .45s cubic-bezier(.3,1.4,.5,1)}
  #oppCar{transition:none}
  .car svg{width:100%;display:block}
  .badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:clamp(20px,3vw,28px)}
  .car.zoom svg{animation:bounce .4s}
  @keyframes bounce{40%{transform:translateY(-10px) rotate(-4deg)}}
  .dots{display:flex;gap:6px;justify-content:center}
  .dot{width:clamp(14px,2.2vw,20px);aspect-ratio:1;border-radius:50%;background:#fff;opacity:.6;border:2px solid var(--ink)}
  .dot.ok{background:var(--yellow);opacity:1}

  .qzone{width:min(1000px,100%);display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:stretch;flex:1}
  .qcard{flex:1 1 320px;max-width:520px;background:#fff;border-radius:24px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
         box-shadow:0 8px 0 rgba(0,0,0,.08)}
  .question{font-size:clamp(44px,9vw,84px);font-weight:800;line-height:1;white-space:nowrap}
  .answer{margin-top:10px;min-width:3.2em;min-height:1.25em;padding:0 .3em;font-size:clamp(44px,9vw,84px);font-weight:800;line-height:1.2;text-align:center;
          border-radius:18px;background:#f0f4fa;border:4px solid #dfe7f2;color:var(--blue)}
  .answer.good{background:#dcf7e8;border-color:var(--green);color:var(--green)}
  .answer.bad{background:#ffe3e3;border-color:var(--red);color:var(--red);animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  .hint{min-height:1.4em;font-size:clamp(18px,2.6vw,24px);font-weight:700;color:var(--red);margin-top:6px}
  .pad{flex:1 1 280px;max-width:380px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .key{font:inherit;font-weight:800;font-size:clamp(28px,4.5vw,40px);border:none;border-radius:18px;background:#fff;color:var(--ink);
       box-shadow:0 6px 0 #c9d3e0;padding:6px 0;cursor:pointer;min-height:clamp(58px,8vh,78px)}
  .key:active{transform:translateY(4px);box-shadow:0 2px 0 #c9d3e0}
  .key.ok{background:var(--green);color:#fff;box-shadow:0 6px 0 #1f9257}
  .key.del{background:#ffe9a8;box-shadow:0 6px 0 #e0c060}

  .overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(20,40,70,.35);z-index:10}
  .overlay.on{display:grid}
  .count{font-size:clamp(120px,25vw,220px);font-weight:800;color:#fff;text-shadow:0 8px 0 #1d6fd1;animation:pop .9s}
  @keyframes pop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
  .toast{position:fixed;top:14px;visibility:hidden;left:50%;transform:translateX(-50%) translateY(-120%);background:#fff;border-radius:999px;padding:8px 20px;
         font-weight:800;font-size:20px;box-shadow:0 6px 20px rgba(0,0,0,.2);transition:transform .35s;z-index:11}
  .toast.on{transform:translateX(-50%) translateY(0);visibility:visible}

  /* RESULT */
  #result{justify-content:center}
  .rescard{text-align:center}
  .rescard .emoji{font-size:clamp(70px,14vw,120px);line-height:1}
  .stars{font-size:clamp(46px,9vw,72px);letter-spacing:6px}
  .stars .off{filter:grayscale(1);opacity:.3}
  .stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px 0}
  .stat{background:#f6f9fd;border-radius:16px;padding:8px 16px;font-size:20px;font-weight:700}
  .stat b{display:block;font-size:30px}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .go.alt{background:var(--blue);box-shadow:0 7px 0 #1d5fc4}
  .confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:20;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  .back-portal{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:30;font:inherit;font-weight:700;font-size:18px;
    text-decoration:none;color:#2b3a55;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 rgba(0,0,0,.1)}
</style>
</head>
<body>

<!-- MENU -->
<section id="menu" class="screen on">
  <a class="back-portal" href="../">◀ Jeux</a>
  <h1>La Course du Calcul</h1>
  <p class="sub">Chaque bonne réponse fait avancer ta voiture. Arriveras-tu avant ton adversaire ?</p>

  <div class="card">
    <h2>1. Quel calcul ?</h2>
    <div class="opts" id="levelOpts"></div>
    <div class="chips" id="tableChips" hidden></div>
  </div>

  <div class="card">
    <h2>2. Contre qui ?</h2>
    <div class="opts" id="rivalOpts"></div>
  </div>

  <div class="card">
    <h2>3. Ta voiture</h2>
    <div class="colors" id="colorOpts"></div>
  </div>

  <button class="go" id="startBtn">🏁 C'est parti !</button>
  <div class="best" id="bestLine"></div>
</section>

<!-- RACE -->
<section id="race" class="screen">
  <div class="topbar">
    <button class="quit" id="quitBtn">✕ Menu</button>
    <div class="dots" id="dots"></div>
    <div class="pill">⏱ <span id="chrono">0,0</span> s</div>
  </div>
  <div class="track">
    <div class="finish"></div>
    <div class="lane"><div class="car" id="oppCar"><span class="badge" id="oppBadge"></span></div></div>
    <div class="lane"><div class="car" id="myCar"><span class="badge">⭐</span></div></div>
  </div>
  <div class="qzone">
    <div class="qcard">
      <div class="question" id="question">3 + 4 =</div>
      <div class="answer" id="answer"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="pad" id="pad"></div>
  </div>
</section>

<!-- RESULT -->
<section id="result" class="screen">
  <div class="card rescard">
    <div class="emoji" id="resEmoji">🏆</div>
    <h2 id="resTitle" style="font-size:clamp(28px,5vw,42px);margin:6px 0">Bravo !</h2>
    <div class="stars" id="resStars"></div>
    <div class="stats">
      <div class="stat">Temps<b id="resTime">0 s</b></div>
      <div class="stat">Erreurs<b id="resErr">0</b></div>
    </div>
    <div class="best" id="resBest" style="margin:4px 0 14px"></div>
    <div class="row">
      <button class="go" id="againBtn">🔁 Rejouer</button>
      <button class="go alt" id="menuBtn">🏠 Menu</button>
    </div>
  </div>
</section>

<div class="overlay" id="countOv"><div class="count" id="countTxt">3</div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const GOAL = 10;
  const LEVELS = {
    add10:   {label:'Additions', sub:'jusqu’à 10', big:'➕', sec:5},
    addsub20:{label:'+ et −', sub:'jusqu’à 20', big:'➕➖', sec:7},
    addsub100:{label:'+ et −', sub:'jusqu’à 100', big:'💯', sec:11},
    mult:    {label:'Tables', sub:'de multiplication', big:'✖️', sec:7}
  };
  const RIVALS = {
    slow:  {emoji:'🐌', label:'L’escargot', sub:'tranquille', f:1.6, color:'#a86ad8'},
    normal:{emoji:'🐇', label:'Le lapin',   sub:'rapide',     f:1.0, color:'#f39c34'},
    fast:  {emoji:'🐆', label:'Le guépard', sub:'très rapide',f:0.65,color:'#8e5b2e'}
  };
  const COLORS = ['#ff5a5f','#3a86ff','#2fbf71','#ffbe0b','#ff70a6'];

  const $ = id => document.getElementById(id);
  const store = {
    get(k, d){ try{ const v = localStorage.getItem('course-calcul:'+k); return v==null ? d : JSON.parse(v);}catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem('course-calcul:'+k, JSON.stringify(v)); }catch(e){} }
  };

  const cfg = Object.assign({level:'add10', rival:'normal', color:COLORS[0], tables:[2,3,4,5]}, store.get('cfg', {}));

  function carSVG(color, num){
    return `<svg viewBox="0 0 120 60" aria-hidden="true">
      <path d="M28 24 L44 9 H80 L97 24 Z" fill="${color}"/>
      <path d="M38 24 L49 13 H62 V24 Z M66 13 H77 L89 24 H66 Z" fill="#d6f1ff"/>
      <rect x="6" y="23" width="108" height="21" rx="9" fill="${color}"/>
      <rect x="108" y="28" width="7" height="6" rx="2" fill="#fff6a8"/>
      <rect x="5" y="29" width="6" height="5" rx="2" fill="#ff3b3b"/>
      ${num!=null?`<circle cx="62" cy="34" r="8" fill="#fff"/><text x="62" y="38.5" font-size="12" font-weight="800" text-anchor="middle" fill="#23324a" font-family="sans-serif">${num}</text>`:''}
      <circle cx="31" cy="45" r="10" fill="#222"/><circle cx="31" cy="45" r="4.5" fill="#bbb"/>
      <circle cx="90" cy="45" r="10" fill="#222"/><circle cx="90" cy="45" r="4.5" fill="#bbb"/>
    </svg>`;
  }

  /* ---------- MENU ---------- */
  function renderMenu(){
    $('levelOpts').innerHTML = Object.entries(LEVELS).map(([k,l]) =>
      `<button class="opt ${cfg.level===k?'sel':''}" data-level="${k}"><span class="big">${l.big}</span>${l.label}<small>${l.sub}</small></button>`).join('');
    $('rivalOpts').innerHTML = Object.entries(RIVALS).map(([k,r]) =>
      `<button class="opt ${cfg.rival===k?'sel':''}" data-rival="${k}"><span class="big">${r.emoji}</span>${r.label}<small>${r.sub}</small></button>`).join('');
    $('colorOpts').innerHTML = COLORS.map(c =>
      `<button class="color ${cfg.color===c?'sel':''}" data-color="${c}" aria-label="couleur">${carSVG(c)}</button>`).join('');
    const tc = $('tableChips');
    tc.hidden = cfg.level !== 'mult';
    tc.innerHTML = [2,3,4,5,6,7,8,9,10].map(t =>
      `<button class="chip ${cfg.tables.includes(t)?'sel':''}" data-table="${t}">× ${t}</button>`).join('');
    const b = store.get('best:'+bestKey(), null);
    $('bestLine').textContent = b ? `🏅 Ton record ici : ${fmt(b)} s` : '';
  }
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-level],[data-rival],[data-color],[data-table]');
    if(!t) return;
    if(t.dataset.level) cfg.level = t.dataset.level;
    if(t.dataset.rival) cfg.rival = t.dataset.rival;
    if(t.dataset.color) cfg.color = t.dataset.color;
    if(t.dataset.table){
      const n = +t.dataset.table;
      cfg.tables = cfg.tables.includes(n) ? cfg.tables.filter(x=>x!==n) : [...cfg.tables, n].sort((a,b)=>a-b);
      if(!cfg.tables.length) cfg.tables = [n];
    }
    store.set('cfg', cfg);
    sfx.tick();
    renderMenu();
  });
  function bestKey(){ return cfg.level + (cfg.level==='mult' ? ':'+cfg.tables.join('-') : ''); }

  /* ---------- SOUND ---------- */
  let ac = null;
  function tone(freq, dur, type='sine', delay=0, vol=.18){
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur);
    }catch(e){}
  }
  const sfx = {
    tick(){ tone(700,.05,'triangle',0,.08); },
    good(){ tone(660,.12,'triangle'); tone(990,.18,'triangle',.1); },
    bad(){ tone(180,.25,'sawtooth',0,.12); },
    count(){ tone(440,.2,'square',0,.1); },
    go(){ tone(880,.4,'square',0,.12); },
    win(){ [523,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',i*.13)); },
    lose(){ [392,330,262].forEach((f,i)=>tone(f,.3,'triangle',i*.18)); }
  };

  /* ---------- QUESTIONS ---------- */
  const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
  let lastQ = '';
  function makeQ(){
    let a,b,op,res,q;
    for(let i=0;i<30;i++){
      switch(cfg.level){
        case 'add10': a=rnd(1,9); b=rnd(1,10-a); op='+'; break;
        case 'addsub20':
          if(Math.random()<.5){ a=rnd(1,19); b=rnd(1,20-a); op='+'; }
          else { a=rnd(3,20); b=rnd(1,a-1); op='−'; } break;
        case 'addsub100':
          if(Math.random()<.5){ a=rnd(5,90); b=rnd(2,Math.min(60,100-a)); op='+'; }
          else { a=rnd(15,100); b=rnd(2,a-3); op='−'; } break;
        case 'mult': {
          const t = cfg.tables[rnd(0,cfg.tables.length-1)], n = rnd(1,10);
          [a,b] = Math.random()<.5 ? [t,n] : [n,t]; op='×'; break; }
      }
      res = op==='+' ? a+b : op==='−' ? a-b : a*b;
      q = `${a} ${op} ${b}`;
      if(q!==lastQ) break;
    }
    lastQ = q;
    return {text:q+' =', res};
  }

  /* ---------- RACE ---------- */
  let st = null;
  const fmt = ms => (ms/1000).toFixed(1).replace('.', ',');

  $('pad').innerHTML = ['7','8','9','4','5','6','1','2','3','⌫','0','OK'].map(k =>
    `<button class="key ${k==='OK'?'ok':k==='⌫'?'del':''}" data-key="${k}">${k}</button>`).join('');
  $('pad').addEventListener('click', e => { const k = e.target.closest('[data-key]'); if(k) press(k.dataset.key); });
  document.addEventListener('keydown', e => {
    if(!st || !$('race').classList.contains('on')) return;
    if(/^[0-9]$/.test(e.key)) press(e.key);
    else if(e.key==='Backspace') press('⌫');
    else if(e.key==='Enter') press('OK');
  });

  function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); }

  function startRace(){
    const lv = LEVELS[cfg.level], rv = RIVALS[cfg.rival];
    st = { score:0, errors:0, input:'', locked:true, t0:0, oppTotal: lv.sec*rv.f*GOAL*1000, oppDoneAt:null, done:false, q:null };
    $('myCar').innerHTML = carSVG(cfg.color, 1) + '<span class="badge">⭐</span>';
    $('oppCar').innerHTML = carSVG(rv.color, 2) + `<span class="badge">${rv.emoji}</span>`;
    setPos('myCar',0); setPos('oppCar',0);
    $('dots').innerHTML = Array.from({length:GOAL},()=>'<span class="dot"></span>').join('');
    $('question').textContent = '…'; $('answer').textContent=''; $('answer').className='answer'; $('hint').textContent='';
    $('chrono').textContent = '0,0';
    show('race');
    const race = st;
    countdown(() => {
      if(st !== race || st.done) return;
      st.t0 = performance.now(); st.locked = false;
      nextQ(); requestAnimationFrame(loop);
    });
  }
  function countdown(cb){
    const ov = $('countOv'), tx = $('countTxt'); let n = 3;
    ov.classList.add('on');
    const step = () => {
      if(n<0){ ov.classList.remove('on'); cb(); return; }
      if(n>0){ tx.textContent = n; sfx.count(); }
      else { tx.textContent = 'Partez !'; sfx.go(); }
      tx.style.animation='none'; void tx.offsetWidth; tx.style.animation='';
      setTimeout(step, n-- > 0 ? 800 : 600);
    };
    step();
  }
  function setPos(id, p){ $(id).style.left = `calc((100% - var(--carw)) * ${Math.min(1,p)})`; }
  function loop(now){
    if(!st || st.done) return;
    const el = now - st.t0;
    $('chrono').textContent = fmt(el);
    const p = el / st.oppTotal;
    setPos('oppCar', p);
    if(p>=1 && !st.oppDoneAt){
      st.oppDoneAt = el;
      toast(`${RIVALS[cfg.rival].emoji} ${RIVALS[cfg.rival].label} est arrivé ! Termine ta course !`);
    }
    requestAnimationFrame(loop);
  }
  function nextQ(){
    st.q = makeQ(); st.input='';
    $('question').textContent = st.q.text;
    $('answer').textContent=''; $('answer').className='answer'; $('hint').textContent='';
  }
  function press(k){
    if(!st || st.locked) return;
    if(k==='⌫'){ st.input = st.input.slice(0,-1); }
    else if(k==='OK'){ return check(); }
    else if(st.input.length<3){ st.input = (st.input==='0'?'':st.input) + k; sfx.tick(); }
    $('answer').textContent = st.input;
  }
  function check(){
    if(st.input==='') return;
    const ok = +st.input === st.q.res, a = $('answer');
    st.locked = true;
    if(ok){
      st.score++; sfx.good();
      a.className='answer good';
      $('dots').children[st.score-1].classList.add('ok');
      setPos('myCar', st.score/GOAL);
      const car=$('myCar'); car.classList.remove('zoom'); void car.offsetWidth; car.classList.add('zoom');
      if(st.score>=GOAL) return finish();
      setTimeout(()=>{ st.locked=false; nextQ(); }, 450);
    } else {
      st.errors++; sfx.bad();
      a.className='answer bad';
      $('hint').textContent = `C’était ${st.q.res}`;
      $('question').textContent = st.q.text.replace('=', '= '+st.q.res);
      setTimeout(()=>{ st.locked=false; nextQ(); }, 1600);
    }
  }
  function finish(){
    st.done = true;
    const time = performance.now() - st.t0;
    const won = !st.oppDoneAt;
    setTimeout(() => showResult(time, won), 700);
  }
  function showResult(time, won){
    const stars = won ? (st.errors===0 ? 3 : 2) : 1;
    const key = 'best:'+bestKey(), prev = store.get(key, null);
    const record = !prev || time < prev;
    if(record) store.set(key, Math.round(time));
    $('resEmoji').textContent = won ? '🏆' : RIVALS[cfg.rival].emoji;
    $('resTitle').textContent = won ? (stars===3 ? 'Parfait, sans faute !' : 'Bravo, tu as gagné !') : `${RIVALS[cfg.rival].label} a gagné… Revanche ?`;
    $('resStars').innerHTML = [1,2,3].map(i=>`<span class="${i<=stars?'':'off'}">⭐</span>`).join('');
    $('resTime').textContent = fmt(time)+' s';
    $('resErr').textContent = st.errors;
    $('resBest').textContent = record ? (prev ? '🎉 Nouveau record !' : '🏅 Premier record enregistré !') : `🏅 Ton record : ${fmt(prev)} s`;
    show('result');
    if(won){ sfx.win(); confetti(); } else sfx.lose();
  }
  function toast(msg){
    const t=$('toast'); t.textContent=msg; t.classList.add('on');
    clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'), 2600);
  }
  function confetti(){
    const cols=['#ff5a5f','#3a86ff','#2fbf71','#ffd23f','#ff70a6'];
    for(let i=0;i<70;i++){
      const c=document.createElement('div'); c.className='confetti';
      c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%cols.length];
      c.style.animationDuration=(1.8+Math.random()*1.8)+'s'; c.style.animationDelay=(Math.random()*.6)+'s';
      document.body.appendChild(c); setTimeout(()=>c.remove(), 4500);
    }
  }

  $('startBtn').onclick = startRace;
  $('againBtn').onclick = startRace;
  $('menuBtn').onclick = () => { renderMenu(); show('menu'); };
  $('quitBtn').onclick = () => { if(st) st.done = true; $('countOv').classList.remove('on'); renderMenu(); show('menu'); };

  renderMenu();
})();
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(() => {}));
}
</script>
