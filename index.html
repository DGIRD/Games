<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mes Jeux</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#bfe6ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes Jeux">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{font-family:'Fredoka','Comic Sans MS',system-ui,sans-serif;color:#2b3a55;min-height:100dvh;
       background:linear-gradient(180deg,#bfe6ff 0%,#e3f4ff 55%,#fff4d6 100%);
       display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;overflow-x:hidden;user-select:none;-webkit-user-select:none}
  .cloud{position:fixed;font-size:80px;opacity:.85;animation:drift linear infinite;z-index:0;pointer-events:none}
  @keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
  h1{position:relative;z-index:1;margin:0 0 6px;font-size:clamp(40px,8vw,72px);font-weight:700;color:#fff;text-align:center;
     text-shadow:0 4px 0 #4d8dff,0 10px 20px rgba(0,0,0,.15)}
  p{position:relative;z-index:1;margin:0 0 26px;font-size:clamp(18px,3vw,24px);text-align:center}
  .games{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:22px;justify-content:center;width:min(900px,100%)}
  .game{flex:1 1 300px;max-width:400px;background:#fff;border-radius:30px;padding:22px;text-decoration:none;color:inherit;text-align:center;
        border:5px solid var(--c);box-shadow:0 10px 0 var(--c),0 18px 30px rgba(0,0,0,.12);transition:transform .15s}
  .game:active{transform:translateY(8px);box-shadow:0 2px 0 var(--c)}
  .game img{width:min(170px,45vw);aspect-ratio:1;border-radius:32px;display:block;margin:0 auto 12px;box-shadow:0 6px 16px rgba(0,0,0,.12)}
  .game .name{font-size:clamp(26px,4vw,34px);font-weight:700}
  .game .desc{font-size:18px;color:#5b6b88;margin-top:4px}
  .game .play{display:inline-block;margin-top:14px;background:var(--c);color:#fff;font-weight:700;font-size:22px;border-radius:999px;padding:8px 28px}
</style>
</head>
<body>
  <div class="cloud" style="top:6%;animation-duration:40s">☁️</div>
  <div class="cloud" style="top:70%;animation-duration:55s;animation-delay:-25s;font-size:60px">☁️</div>

  <h1>Mes Jeux</h1>
  <p>Choisis ton jeu !</p>

  <div class="games">
    <a class="game" href="pendu/" style="--c:#ff9f43">
      <img src="icon-192.png" alt="">
      <div class="name">🎈 Le Pendu des Ballons</div>
      <div class="desc">Trouve le mot avant que les ballons éclatent<br>+ les mots de la dictée</div>
      <span class="play">Jouer</span>
    </a>
    <a class="game" href="course-du-calcul/" style="--c:#3a86ff">
      <img src="course-du-calcul/icone.png" alt="">
      <div class="name">🏎️ La Course du Calcul</div>
      <div class="desc">Chaque bonne réponse fait avancer ta voiture<br>+ − et tables de ×</div>
      <span class="play">Jouer</span>
    </a>
  </div>

<script>
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
